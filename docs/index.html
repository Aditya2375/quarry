<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quarry - a small relational database, live in your browser</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --edge: #30363d; --fg: #7ee787; --dim: #8b949e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 .star { color: var(--dim); font-weight: normal; }
  p.sub { color: var(--dim); margin: 0 0 20px; }
  a { color: #58a6ff; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; margin-bottom: 16px; }
  .panel header { padding: 8px 12px; border-bottom: 1px solid var(--edge); color: var(--dim); font-size: 12px; }
  #out { padding: 12px; white-space: pre-wrap; min-height: 280px; max-height: 50vh; overflow-y: auto; }
  #out .err { color: #ff7b72; }
  #out .cmd { color: #58a6ff; }
  .inputrow { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
  .inputrow .prompt { color: var(--dim); }
  input { flex: 1; background: transparent; border: 0; color: var(--fg);
          font: inherit; outline: none; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  button { background: #21262d; color: var(--fg); border: 1px solid var(--edge);
           border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>quarry <span class="star">- a small relational database</span></h1>
  <p class="sub">The real engine (pager + WAL + B+tree + SQL executor) compiled to WebAssembly,
     running in this tab. The database lives in the tab's memory and disappears when you close it.
     <a href="https://github.com/Aditya2375/quarry">Source on GitHub</a>.</p>

  <div class="row" id="examples"></div>

  <div class="panel">
    <header>quarry - sql session</header>
    <div id="out"></div>
    <div class="inputrow">
      <span class="prompt">quarry&gt;</span>
      <input id="sql" placeholder="SELECT * FROM employees;" autocomplete="off" spellcheck="false">
    </div>
  </div>
</main>

<script src="quarry.js"></script>
<script>
const EXAMPLES = [
  "SELECT * FROM employees;",
  "SELECT name, salary FROM employees WHERE role = 'engineer' ORDER BY salary DESC;",
  "SELECT COUNT(*) FROM employees WHERE salary >= 135;",
  "UPDATE employees SET salary = 145 WHERE name = 'Grace Hopper';",
  "BEGIN;",
  "ROLLBACK;",
  "DELETE FROM employees WHERE salary < 120;",
];
const out = document.getElementById('out');
const input = document.getElementById('sql');
let M = null;

function println(text, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}
function run(sql) {
  if (!M) { println('loading engine...', 'err'); return; }
  println('quarry> ' + sql, 'cmd');
  const res = M.ccall('quarry_exec', 'string', ['string'], [sql.replace(/;\s*$/, '')]);
  res.replace(/\n$/, '').split('\n').forEach(l => println(l, l.startsWith('error:') ? 'err' : ''));
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && input.value.trim()) { run(input.value.trim()); input.value = ''; }
});
const ex = document.getElementById('examples');
EXAMPLES.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s.length > 42 ? s.slice(0, 40) + '...' : s;
  b.title = s;
  b.onclick = () => run(s);
  ex.appendChild(b);
});
const rb = document.createElement('button');
rb.textContent = 'reset database';
rb.onclick = () => { if (M) println(M.ccall('quarry_reset', 'string', [], []), ''); };
ex.appendChild(rb);

QuarryModule().then(m => {
  M = m;
  println('quarry ready - a demo EMPLOYEES table is loaded. Type SQL, or click an example.');
  input.focus();
});
</script>
</body>
</html>
